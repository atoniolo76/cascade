[project]
name = "cascade"
version = "0.1.0"
description = "Cascade app: trace ingest, simulator fan-out, and UI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
sail = ["sail"]

[project.scripts]
cascade = "cascade.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.7", "boto3>=1.36"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
# Alessio's standalone Modal profiler scripts keep their own style.
extend-exclude = ["accelsim_trace.py", "vllm_trace.py", "test_phases.py", "kernel_microbench.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
