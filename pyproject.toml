[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cascade-profiler"
version = "0.1.0"
description = "GPU workload tracing and baseline/profiled timeline reconciliation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Benchmark",
]

[project.urls]
Repository = "https://github.com/atoniolo76/cascade"
Documentation = "https://github.com/atoniolo76/cascade/blob/profiler/PROFILER_RUNS.md"
Issues = "https://github.com/atoniolo76/cascade/issues"

[project.optional-dependencies]
modal = ["modal", "boto3>=1.36"]
vllm = ["vllm==0.21.0", "nvtx"]

[tool.setuptools.packages.find]
include = ["cascade_profiler*"]
