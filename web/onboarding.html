<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Cascade · Get set up</title>
    <meta name="description" content="Connect a trace, pick a fleet, choose a router and watch Cascade run its first replay." />
    <script>
      try {
        var t = localStorage.getItem("cascade.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/onboarding/standalone.tsx"></script>
  </body>
</html>
